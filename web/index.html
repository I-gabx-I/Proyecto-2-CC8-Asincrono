<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIMG — visor</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <canvas id="lienzo"></canvas>

  <header id="barra">
    <strong>PIMG</strong>
    <select id="selector"></select>
    <span id="estado">desconectado</span>
    <span id="coord" class="coord"></span>
    <span class="ir">
      <input id="irX" type="number" min="0" placeholder="x">
      <input id="irY" type="number" min="0" placeholder="y">
      <button id="irBoton">Ir</button>
    </span>
    <button id="panelesBoton">Paneles</button>
    <span class="ayuda">arrastrar: mover · rueda o pellizco: zoom · G: cuadrícula</span>
  </header>

  <aside id="panel"></aside>
  <aside id="control">
    <h2>Control de ritmo (PI) · <span class="r">R</span> · <span class="q">Q</span></h2>
    <canvas id="grafica" width="300" height="110"></canvas>
    <div id="ctrlTexto">—</div>
  </aside>
  <aside id="red">
    <h2>Red simulada</h2>
    <label>Pérdida <input id="simPerd" type="number" min="0" max="50" value="0"> %</label>
    <label>Ancho de banda <input id="simBw" type="number" min="0" max="1000000" value="0"> KB/s (0 = sin límite)</label>
    <label>Latencia <input id="simLat" type="number" min="0" max="2000" value="0"> ms</label>
    <button id="simAplicar">Aplicar</button>
    <label>Cliente lento <input id="lento" type="number" min="0" max="1000" value="0"> ms/tile</label>
    <div id="simEstado">sin aplicar</div>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
